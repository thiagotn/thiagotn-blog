  description: "Blog pessoal do Thiago Nogueira (thiagotn) — homelab, Kubernetes, infraestrutura e opiniões pessoais."
  authorimage: "eu.jpeg"
  dateformat: "2 Jan 2006"

  meta:
    description: "Blog pessoal do Thiago Nogueira (thiagotn) — homelab, Kubernetes, infraestrutura e opiniões pessoais."
    keywords: "homelab,kubernetes,k3s,gitops,devops,infraestrutura,blog pessoal"

  social:
    github: "thiagotn"
    linkedin: "thiagotn"

  extra:
    copyright: "© 2026 Thiago Nogueira · blog pessoal, opiniões minhas. Conteúdo sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."
    poweredby: true
    highlightjs: true
    socialmarkup: true
    toc: true
    displayrssicon: true

menu:
  main:
    - name: "posts"
      identifier: "posts"
