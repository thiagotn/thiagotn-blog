baseURL: "https://thiagotn.com/"
title: "thiagotn"
# pt-BR na raiz (URLs originais preservadas); inglês sob /en/.
defaultContentLanguage: "pt-br"
defaultContentLanguageInSubdir: false
canonifyURLs: false
buildDrafts: false
# enableGitInfo desligado: o build da imagem (.dockerignore) não inclui o .git.
enableGitInfo: false

author: "thiagotn"

# Do tema sobraram só os favicons/manifest. Declarar `mounts` substitui TODOS os
# mounts default do módulo, então os layouts/ do tema também deixam de ser montados
# — intencional: todo o markup é nosso (layouts/*.html), e um nome de layout errado
# agora falha com WARN alto em vez de renderizar o layout do tema standalone (sem
# baseof, trazendo Bootstrap de volta) num build verde.
# O excludeFiles impede que o custom.css/js vazio do módulo ressuscite e que o
# main.css morto do tema seja publicado.
module:
  imports:
    - path: github.com/shenoydotme/hugo-goa
      mounts:
        - source: static
          target: static
          excludeFiles:
            - 'css/**'
            - 'js/**'

# Default do Hugo é {category: categories, tag: tags}. Nenhum post usa categories,
# e as páginas vazias /categories/ e /en/categories/ iam para o sitemap.
taxonomies:
  tag: tags

markup:
  highlight:
    # Classes em vez de styles inline: é o que permite dois temas (chroma.css).
    noClasses: false
    codeFences: true
    # 46 das 116 cercas do content/ não têm linguagem e são diagramas ASCII,
    # árvores de diretório e saída de terminal — com guessSyntax o Chroma
    # chuta errado (gdscript3 numa árvore de diretórios) e colore lixo.
    guessSyntax: false
    lineNos: false
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

# Params neutros de idioma. languages.<lang>.params é deep-merged por cima
# destes: a chave do idioma vence; o que faltar cai para cá.
params:
  author: "Thiago Nogueira"
  authorimage: "eu.jpeg"
  social:
    github: "thiagotn"
    linkedin: "thiagotn"
  extra:
    poweredby: true
    toc: true
    displayrssicon: true

languages:
  pt-br:
    languageCode: "pt-BR"
    languageName: "Português"
    weight: 1
    title: "thiagotn"
    params:
      intro: "Engenheiro de software. Escrevo sobre software, infraestrutura e o que mais der vontade. Opiniões minhas, não do meu empregador."
      description: "Blog pessoal do Thiago Nogueira (thiagotn) — software, infraestrutura e o que mais der vontade."
      dateformat: "2 Jan 2006"
      # Fallback de og:image para páginas sem `images:` no front matter.
      images: ["images/og-default.png"]
      meta:
        description: "Blog pessoal do Thiago Nogueira (thiagotn) — software, infraestrutura e o que mais der vontade."
        keywords: "software,infraestrutura,homelab,kubernetes,vibecoding,ia,open-source,blog pessoal"
      extra:
        copyright: "© 2026 Thiago Nogueira · blog pessoal, opiniões minhas. Conteúdo sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."
    menus:
      main:
        - name: "posts"
          identifier: "posts"
          pageRef: "/posts"
          weight: 100
        - name: "sobre"
          identifier: "about"
          pageRef: "/about"
          weight: 200
  en:
    languageCode: "en"
    languageName: "English"
    weight: 2
    title: "thiagotn"
    params:
      intro: "Software engineer. I write about software, infrastructure and whatever else I feel like. My opinions, not my employer's."
      description: "Personal blog of Thiago Nogueira (thiagotn) — software, infrastructure and whatever else."
      dateformat: "Jan 2, 2006"
      images: ["images/og-default-en.png"]
      meta:
        description: "Personal blog of Thiago Nogueira (thiagotn) — software, infrastructure and whatever else."
        keywords: "software,infrastructure,homelab,kubernetes,vibecoding,ai,open-source,personal blog"
      extra:
        copyright: "© 2026 Thiago Nogueira · personal blog, my opinions. Content under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)."
    menus:
      main:
        - name: "posts"
          identifier: "posts"
          pageRef: "/posts"
          weight: 100
        - name: "about"
          identifier: "about"
          pageRef: "/about"
          weight: 200
