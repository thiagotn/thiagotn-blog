worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; server_tokens off;

    # Redirects relativos: o nginx escuta em :8080 atrás do Traefik (que termina o TLS). Sem isto,
    # o redirect de trailing-slash (ex.: /blog → /blog/) vazaria a porta interna no Location
    # (http://host:8080/...). absolute_redirect off → o Location vira relativo, e o browser resolve
    # contra https://thiagotn.com. (port_in_redirect off como reforço.)
    absolute_redirect off;
    port_in_redirect off;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml application/rss+xml;

    log_format main '$remote_addr - $status "$request" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # www → apex canônico (301). O Ingress roteia www até aqui; o redirect é feito no nginx.
    server {
        listen 8080;
        server_name www.thiagotn.com;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        return 301 https://thiagotn.com$request_uri;
    }

    # Conteúdo (apex canônico + default)
    server {
        listen 8080 default_server;
        server_name thiagotn.com _;
        root /usr/share/nginx/html;
        index index.html;

        # Headers de segurança no nível do server (nginx só herda em locations sem add_header próprio;
        # por isso o cache abaixo usa `expires`, não add_header).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Assets fingerprintados do Hugo/Hextra (CSS/JS/fontes/imagens) — cache longo.
        location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # HTML e feeds — sem cache agressivo (conteúdo muda a cada deploy).
        location ~* \.(html|xml|json)$ { expires -1; }
        location = / { expires -1; try_files /index.html =404; }

        location = /robots.txt  { access_log off; }
        location = /sitemap.xml { }

        # Hugo gera diretórios com index.html (pretty URLs); 404 do tema p/ rotas inexistentes.
        location / { try_files $uri $uri/ /404.html; }
    }
}
